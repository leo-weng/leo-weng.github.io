<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball Roguelike v2</title>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column, like standing courtside. Scoreboard on top, the decision in the middle, big buttons at the thumb. */
:root {
  --bg: #eef0f3;
  --panel: #ffffff;
  --ink: #17202c;
  --muted: #5a6676;
  --line: #d4d9e0;
  --maple: #e9c99c;       /* gym floor */
  --maple-2: #dcb886;
  --paint: #22406a;       /* court paint and net */
  --ball: #f0a020;        /* ball yellow */
  --accent: #e0531f;      /* action orange */
  --accent-ink: #ffffff;
  --win: #1f8a4c; --lose: #c0362f;
  --great: #1f9a52; --good: #79b54a; --even: #d6b02a; --risky: #e57a2b; --bad: #c9382f;
  --hole: #241b14;
  --shade: #141a24;     /* block shadow */
  --crack: #5a3d22;
  --us: #2d6fd1; --them: #c0362f;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --panel: #18202b; --ink: #e6ebf1; --muted: #98a4b3; --line: #2b3746;
    --maple: #6b5338; --maple-2: #5c462e; --paint: #8fb3e8; --ball: #f5b33a; --accent: #f26a35; --accent-ink: #1a0f08;
    --win: #4fcf86; --lose: #f2726a; --great: #3fcf7a; --good: #9ccd63; --even: #e6c449; --risky: #f39552; --bad: #f2726a;
    --hole: #07090c; --shade: #000000; --crack: #23170c; --us: #6da3f0; --them: #f2726a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --panel: #18202b; --ink: #e6ebf1; --muted: #98a4b3; --line: #2b3746;
  --maple: #6b5338; --maple-2: #5c462e; --paint: #8fb3e8; --ball: #f5b33a; --accent: #f26a35; --accent-ink: #1a0f08;
  --win: #4fcf86; --lose: #f2726a; --great: #3fcf7a; --good: #9ccd63; --even: #e6c449; --risky: #f39552; --bad: #f2726a;
  --hole: #07090c; --shade: #000000; --crack: #23170c; --us: #6da3f0; --them: #f2726a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 540px; margin: 0 auto; display: grid; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [role="button"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Scoreboard */
#top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 6px; }
#top:empty { display: none; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.team-score { display: flex; align-items: baseline; gap: 8px; font: 700 0.85rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.team-score b { font: 800 2.2rem/1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.team-score.you b { color: var(--us); } .team-score.them { justify-content: flex-end; } .team-score.them b { color: var(--them); }
.score-mid { display: grid; justify-items: center; gap: 4px; }
.serving { font: 0.72rem var(--font-mono); color: var(--muted); white-space: nowrap; }
.chain { display: flex; align-items: center; gap: 4px; }
.chain-label { font: 700 0.72rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-right: 2px; }
.cpip { font: 700 0.68rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.cpip.lit { background: var(--ball); border-color: var(--ball); color: #2a1a00; }

/* Role banner: who you are right now */
.role { display: grid; gap: 4px; }
.role h2 { font: 800 1.9rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.role p { margin: 0; color: var(--muted); }
.role-chip { justify-self: start; font: 700 0.8rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.1em; background: var(--paint); color: var(--bg); padding: 5px 9px; border-radius: 4px; }
.title h1 { font: 800 2.6rem/0.95 var(--font-display); text-transform: uppercase; margin: 12px 0 4px; text-wrap: balance; }
.kicker { margin: 0; font: 0.8rem var(--font-mono); color: var(--muted); }
.how { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }

/* Views */
#net svg, #court svg { width: 100%; height: auto; display: block; }
#net:empty, #court:empty, #info:empty, #actions:empty, #go:empty { display: none; }
#net { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.netview .floor { stroke: var(--maple-2); stroke-width: 6; }
.netview .net-mesh { opacity: 0.9; } .netview .mesh-line { stroke: var(--paint); stroke-width: 1; opacity: 0.45; fill: none; }
.netview .net-tape { fill: var(--paint); } .netview .antenna { stroke: var(--accent); stroke-width: 5; }
.blk .b-body, .blk .b-head { fill: var(--them); } .blk .b-arm { stroke: var(--them); stroke-width: 9; stroke-linecap: round; }
.blk-us .b-body, .blk-us .b-head { fill: var(--us); } .blk-us .b-arm { stroke: var(--us); }
.blk-off, .blk-ready { opacity: 0.35; } .blk-late { opacity: 0.7; }
.ntok.ntok-them circle { fill: var(--them); } .ntok.ntok-them.ntok-setter circle { opacity: 0.75; }
.tell-arrow { stroke: var(--ink); stroke-width: 6; fill: none; stroke-linecap: round; } .tell-tip .tell-arrow { stroke-dasharray: 4 9; }
.tell-head { fill: var(--ink); } .tell-word { fill: var(--ink); font: 700 22px var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; }
.tell-anim { opacity: 0; animation: fadein 0.3s 1.4s forwards; } @keyframes fadein { to { opacity: 1; } }
.set-trail { fill: none; stroke: var(--ball); stroke-width: 3; stroke-dasharray: 6 8; opacity: 0.8; }
.nball { fill: var(--ball); stroke: #7a4a00; stroke-width: 2; }
.ntok circle { fill: var(--us); stroke: var(--panel); stroke-width: 3; } .ntok .ntok-label { fill: #fff; font: 700 24px var(--font-display); text-anchor: middle; }
.ntok .ntok-sub { fill: var(--muted); font: 15px var(--font-body); text-anchor: middle; }
.ntok.is-sel circle { stroke: var(--ball); stroke-width: 6; } .ntok.is-off { opacity: 0.35; }
.ntok-setter circle { fill: var(--paint); }
.side-tag { fill: var(--muted); font: 700 13px var(--font-display); letter-spacing: 0.12em; }
.netview .side-tag { font-size: 22px; }

.court .tile { fill: var(--maple); stroke: var(--paint); stroke-width: 1; stroke-opacity: 0.55; }
.court .tile.pickable { cursor: pointer; }
.court .tile-g[role="button"]:hover .tile { fill: var(--maple-2); }
.court .tint { opacity: 0.55; } .t-great { fill: var(--great); } .t-good { fill: var(--good); } .t-even { fill: var(--even); } .t-risky { fill: var(--risky); } .t-bad { fill: var(--bad); }
.court .sel { fill: none; stroke: var(--ink); stroke-width: 3.5; } .court .sel-great { stroke: var(--great); } .court .sel-good { stroke: var(--good); } .court .sel-risky { stroke: var(--risky); } .court .sel-bad { stroke: var(--bad); }
.court .mark { fill: none; stroke: var(--us); stroke-width: 4; stroke-dasharray: 8 5; }
.court .shadow { opacity: 0.55; } .hatch-line { stroke: var(--paint); stroke-width: 3; }
.court .hole { fill: var(--hole); }
.court .cracks path { fill: none; stroke: var(--crack); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.court .pip-on { fill: var(--paint); } .court .pip-off { fill: none; stroke: var(--paint); stroke-width: 1; opacity: 0.5; }
.court .flash { fill: var(--ball); opacity: 0; animation: flash 0.9s 0.65s ease-out; pointer-events: none; }
@keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
.court .net-line { stroke: var(--paint); stroke-width: 6; stroke-linecap: round; }
.tok circle { stroke: var(--panel); stroke-width: 2.5; } .tok text { font: 700 12px var(--font-display); text-anchor: middle; fill: #fff; pointer-events: none; }
.tok-them circle { fill: var(--them); } .tok-us circle { fill: var(--us); }
.tok:not([role="button"]), .cblk:not([role="button"]), .ball-g, .tint, .sel, .cracks, .pips, .hole, .fan, .dig, .dig-in, .lean, .attack-line { pointer-events: none; }
.tok[role="button"], .cblk[role="button"], .sq-target { cursor: pointer; }
.tok-hitter circle { stroke: var(--ball); stroke-width: 4; }
.tok.is-sel circle { stroke: var(--ink); stroke-width: 4; } .tok.is-moved circle { stroke: var(--ball); stroke-width: 4; }
.tok-serve.is-seam circle { opacity: 0.85; } .tok-serve text { font-size: 11px; }
.tok-serve.tone-great circle { stroke: var(--great); stroke-width: 5; } .tok-serve.tone-good circle { stroke: var(--good); stroke-width: 5; } .tok-serve.tone-even circle { stroke: var(--even); stroke-width: 5; }
.tok-serve.tone-risky circle { stroke: var(--risky); stroke-width: 5; } .tok-serve.tone-bad circle { stroke: var(--bad); stroke-width: 5; }
.tok-serve.is-sel circle { stroke: var(--ink); stroke-width: 6; }
.tok .tok-sub { fill: var(--ink); font: 11px var(--font-body); }
.subgrid { stroke: var(--paint); stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.45; fill: none; }
.dig { stroke-width: 2; fill-opacity: 0.16; stroke-opacity: 0.85; } .dig-in { stroke: none; fill-opacity: 0.22; }
.dig-us, .dig-in-us { fill: var(--us); stroke: var(--us); } .dig-them, .dig-in-them { fill: var(--them); stroke: var(--them); }
.court .big-tile { fill: none; stroke: var(--paint); stroke-width: 2.5; pointer-events: none; }
.court .tile { stroke-opacity: 0.3; }
.run-line { display: flex; gap: 6px; flex-wrap: wrap; }
.run-line .stop { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.run-line .stop.now { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.run-line .stop.done { text-decoration: line-through; }
.scout { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 10px; }
.scout h2 { margin: 0; }
.scout .role-chip { align-self: flex-start; }
.scout p { margin: 0; }
.scout .trait { border-left: 4px solid var(--them); padding-left: 10px; }
.scout .sbars { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.scout .sbar { display: flex; gap: 6px; align-items: center; }
.scout .sbar b { color: var(--them); letter-spacing: 2px; font-weight: 400; }
.scout-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.scout .weak, .scout .their-board { font-size: 14px; color: var(--muted); }
.attack-line { stroke: var(--paint); stroke-width: 3; } .court .ctr { fill: var(--paint); opacity: 0.6; pointer-events: none; }
.lean-from { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0.6; } .lean-arrow { stroke: var(--ink); stroke-width: 2.5; fill: none; opacity: 0.75; } .lean-head { fill: var(--ink); }
.fan-edge { fill: var(--shade); opacity: 0.2; } .fan-core { fill: var(--shade); opacity: 0.38; } .fan-edge.fan-late { opacity: 0.1; } .fan-core.fan-late { opacity: 0.2; }
.sq-target { fill: color-mix(in srgb, var(--us) 18%, transparent); stroke: var(--us); stroke-width: 2.5; stroke-dasharray: 5 4; }
.sq-target:hover { fill: color-mix(in srgb, var(--us) 35%, transparent); }
.cblk rect { stroke: var(--panel); stroke-width: 1.5; } .cblk-them rect { fill: var(--them); } .cblk-us rect { fill: var(--us); } .cblk-late rect { opacity: 0.6; }
.cblk text { fill: #fff; font: 700 10px var(--font-display); text-anchor: middle; pointer-events: none; }
.cblk.is-sel rect { stroke: var(--ink); stroke-width: 3; } .cblk.is-moved rect { stroke: var(--ball); stroke-width: 3; }
.ball-trail { fill: none; stroke: var(--ball); stroke-width: 3; stroke-dasharray: 5 6; }
.ball { fill: var(--ball); stroke: #7a4a00; stroke-width: 2; }
.burst { fill: none; stroke: var(--ball); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; animation: burst 0.6s 0.7s ease-out; }
@keyframes burst { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }
.shake { animation: shake 0.45s 0.7s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }

/* Info and notes */
.info { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.info b { font-family: var(--font-display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.03em; }
.tw { font-weight: 700; } .tw.t-great { color: var(--great); } .tw.t-good { color: var(--good); } .tw.t-even { color: var(--even); } .tw.t-risky { color: var(--risky); } .tw.t-bad { color: var(--bad); }
.note { margin: 0 0 6px; padding: 8px 12px; border-radius: 8px; border-left: 4px solid var(--paint); background: var(--panel); }
.note.warn { border-left-color: var(--risky); } .note.good { border-left-color: var(--ball); }
.note.intent { border-left-color: var(--them); font-weight: 700; }
.muted { color: var(--muted); } .small { font-size: 0.85rem; }

/* Action buttons */
.group { display: grid; gap: 6px; } .group h3 { margin: 6px 0 0; font: 700 0.95rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
#actions { display: grid; gap: 10px; }
.pills { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pill { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 9px 12px; display: grid; gap: 2px; min-width: 0; }
.pill:hover:not(:disabled) { border-color: var(--paint); }
.pill.is-on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
.pill:disabled { opacity: 0.45; cursor: not-allowed; }
.pill-name { font: 700 1.2rem/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
.pill-sub { font-size: 0.82rem; color: var(--muted); }
.pill-small { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 0.85rem; }
.go { width: 100%; border: 0; border-radius: 14px; padding: 15px; background: var(--accent); color: var(--accent-ink); font: 800 1.45rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; }
.go:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.cards { display: grid; gap: 8px; }
.card { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 3px; }
.card:hover { border-color: var(--accent); }
.card-dial { justify-self: start; font: 600 0.7rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--paint); border: 1px solid currentColor; border-radius: 99px; padding: 3px 7px; }
.card-name { font: 800 1.4rem/1.05 var(--font-display); text-transform: uppercase; }
.card-desc { color: var(--muted); }

/* Result */
.result { display: grid; gap: 2px; }
.callout { margin: 0; font: 800 clamp(2.4rem, 11vw, 3.4rem)/0.95 var(--font-display); text-transform: uppercase; text-wrap: balance; }
.r-win .callout { color: var(--win); } .r-lose .callout { color: var(--lose); }
.pts { margin: 0; font: 700 1.3rem/1.1 var(--font-mono); }
.result .sub { margin: 2px 0 0; color: var(--muted); }

/* Lab */
footer { display: flex; justify-content: flex-end; }
.lab-link { background: none; border: 0; color: var(--muted); font: 0.8rem var(--font-mono); text-decoration: underline; padding: 6px; }
#lab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.lab-head { display: flex; justify-content: space-between; align-items: center; } .lab-head h3 { margin: 0; font: 800 1.3rem var(--font-display); text-transform: uppercase; }
#lab h4 { margin: 10px 0 4px; font: 700 0.95rem var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.mono { font: 0.78rem/1.5 var(--font-mono); margin: 0; }
.log { white-space: pre-wrap; overflow-x: auto; max-height: 320px; overflow-y: auto; }
@media (prefers-reduced-motion: reduce) { .shake, .burst, .flash { animation: none !important; } }
</style>
<div class="app">
  <div id="top"></div>
  <div id="role"></div>
  <div id="net"></div>
  <div id="court"></div>
  <div id="info"></div>
  <div id="actions"></div>
  <div id="go"></div>
  <footer><button class="lab-link" data-act="lab">Lab</button></footer>
  <div id="lab" hidden></div>
