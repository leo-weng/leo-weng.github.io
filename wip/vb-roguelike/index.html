<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volleyball Roguelike</title>
<style>
:root { --bg: #eef0f3; --panel: #fff; --ink: #17202c; --muted: #5a6676; --line: #d4d9e0; --accent: #e0531f; }
@media (prefers-color-scheme: dark) { :root { --bg: #10151c; --panel: #18202b; --ink: #e6ebf1; --muted: #98a4b3; --line: #2b3746; --accent: #f26a35; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; padding: 32px 16px; }
main { max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
h1 { margin: 0 0 8px; font-size: 2rem; }
a.card { display: grid; gap: 4px; padding: 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
a.card b { font-size: 1.2rem; } a.card span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Volleyball Roguelike</h1>
  <a class="card" href="v2/"><b>v2 (in progress)</b><span>Draft 4: one match on a drawn court with no dice. Swings land on the square you pick, a ball inside a defender's circle is dug, and their defense chases what you do.</span></a>
  <a class="card" href="v1/"><b>v1 sandbox</b><span>The frozen v1 sandbox (version 25) with the odds tables and Tiles mode.</span></a>
</main>
</body>
</html>
