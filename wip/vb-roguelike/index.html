<style>
/* Layout: a coach's clipboard. The live decision on the left, the stat sheet on the right; stacks on phones. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #15202b;
  --muted: #5b6977;
  --line: #d3dae1;
  --accent: #c8501d;      /* court orange */
  --net: #24508f;         /* net / block blue */
  --kill: #2e7d4f;
  --blocked: #24508f;
  --dug: #8a96a3;
  --error: #b3362f;
  --late: #8fa9d1;
  --flash: #ffe2c9;
  --floor: #f3e3cf;       /* court wood */
  --court: #e9c9a3;
  --great: #1f8a4c; --good: #5fa35a; --even: #b8901c; --risky: #d0662a; --bad: #b3362f;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151b; --surface: #17202a; --ink: #e3e9ef; --muted: #93a1af; --line: #2a3644;
    --accent: #f07a45; --net: #7ea6e6; --kill: #5cc286; --blocked: #7ea6e6; --dug: #6c7a88; --error: #f0756c;
    --late: #46618c; --flash: #4a2c1c; --floor: #2a2119; --court: #3a2c20; --great: #4fd18a; --good: #93c76a; --even: #e0b84a; --risky: #f08a4f; --bad: #f0756c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17202a; --ink: #e3e9ef; --muted: #93a1af; --line: #2a3644;
  --accent: #f07a45; --net: #7ea6e6; --kill: #5cc286; --blocked: #7ea6e6; --dug: #6c7a88; --error: #f0756c;
  --late: #46618c; --flash: #4a2c1c; --floor: #2a2119; --court: #3a2c20; --great: #4fd18a; --good: #93c76a; --even: #e0b84a; --risky: #f08a4f; --bad: #f0756c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); padding-inline: 16px; padding-block: 20px 40px; }
.top { max-width: 1120px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.top h1 { font: 700 2rem/1 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.top p { margin: 0; color: var(--muted); }
.layout { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stage, .side { min-width: 0; display: grid; gap: 16px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
.phase-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.phase h2 { font: 700 1.6rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; margin: 0; }
.lede { margin: 0; }
.hint { margin: 0; color: var(--muted); font-size: 0.9rem; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.chip { font: 600 0.72rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 5px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.chip-clear { color: var(--kill); } .chip-fuzzy { color: var(--accent); } .chip-blind { color: var(--muted); }

.net { display: inline-grid; max-width: 100%; overflow-x: auto; justify-self: start; }
.ruler { font: 600 1.15rem/1 var(--font-mono); letter-spacing: 0.12em; color: var(--muted); white-space: nowrap; padding: 6px 0 2px; border-bottom: 3px solid var(--net); }
.ruler .ant { color: var(--accent); }
.ruler b { font-weight: 700; }
.m-setter { color: var(--ink); } .m-block { color: var(--net); } .m-late { color: var(--late); } .m-guess { color: var(--accent); } .m-ball { color: var(--accent); }
.ruler-scale { display: flex; justify-content: space-between; font: 0.7rem var(--font-mono); color: var(--muted); padding-top: 3px; }

.hitters { display: grid; gap: 12px; }
.hitter-row { display: grid; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); align-content: start; min-width: 0; }
.hitter-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
.pos { font: 700 0.95rem/1 var(--font-display); background: var(--ink); color: var(--surface); padding: 4px 7px; border-radius: 4px; letter-spacing: 0.04em; }
.calls { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.call, .shot { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; }
.call:hover:not(:disabled), .shot:hover:not(:disabled) { border-color: var(--accent); }
.call:disabled, .shot:disabled { opacity: 0.5; cursor: not-allowed; }
.call-name, .shot-name { font: 700 1.25rem/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
.call-meta, .cone { font: 0.78rem var(--font-mono); color: var(--muted); }
.call-odds { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.q { font-weight: 600; } .q-perfect { color: var(--kill); } .q-good { color: var(--ink); } .q-off { color: var(--error); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font: 600 0.68rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; background: var(--line); color: var(--ink); vertical-align: middle; }
.tag-trick { background: var(--accent); color: var(--surface); }
.tag-plan { background: var(--ink); color: var(--surface); }
.call-plan { border-color: var(--ink); border-width: 2px; padding: 9px 11px; }
.locked { font: 0.78rem var(--font-mono); color: var(--muted); }

.shots { display: grid; gap: 8px; }
.shot-default { border-color: var(--ink); }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); margin-top: 4px; }
.seg { display: block; flex-grow: 0; flex-shrink: 0; }
.seg-kill { background: var(--kill); } .seg-blocked { background: var(--blocked); } .seg-dug { background: var(--dug); } .seg-error { background: var(--error); }
.nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 0.85rem var(--font-mono); font-variant-numeric: tabular-nums; }
.num i { font-style: normal; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 5px; color: var(--muted); }
.num-kill { color: var(--kill); font-weight: 600; } .num-error { color: var(--error); }

.result { text-align: left; transition: background-color 0.5s ease; }
.result.pending { background: var(--flash); }
.result.pending .callout, .result.pending .result-line, .result.pending .why { visibility: hidden; }
.callout { font: 700 clamp(2.4rem, 7vw, 3.6rem)/0.95 var(--font-display); text-transform: uppercase; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.tone-big .callout { color: var(--accent); }
.tone-good .callout { color: var(--kill); }
.tone-bad .callout { color: var(--error); }
.tone-neutral .callout { color: var(--muted); }
.result-line { margin: 0; font-size: 1.05rem; }
.why { margin: 0; padding-left: 18px; color: var(--muted); }
.primary { justify-self: start; background: var(--ink); color: var(--surface); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; display: inline-flex; gap: 10px; align-items: center; }
kbd { font: 0.72rem var(--font-mono); border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px; opacity: 0.75; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.panel h3 { font: 700 1.1rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
tbody th { font-weight: 500; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font: 0.8rem var(--font-mono); }
.log li { display: grid; grid-template-columns: 3ch minmax(0, 1fr) auto; gap: 8px; padding-block: 4px; border-bottom: 1px solid var(--line); }
.log .ln { color: var(--muted); }
.log .steps { color: var(--muted); }
.log li b { white-space: nowrap; }
.o-us b { color: var(--kill); } .o-them b { color: var(--error); }
.scoreboard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 18px; }
.scoreboard .team { display: flex; align-items: baseline; gap: 10px; }
.scoreboard .tname { font: 700 1rem/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8; }
.scoreboard .pts { font: 700 2.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score-mid { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; font: 0.75rem var(--font-mono); opacity: 0.8; text-align: center; }
.point { margin: 0; font: 700 1.2rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.point-us { color: var(--kill); } .point-them { color: var(--error); }
.field { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.9rem; }
select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
.stats { display: grid; gap: 6px; }
.stat-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: start; gap: 8px; }
.stat-row .pos { justify-self: start; }
.stat-list { display: grid; grid-template-columns: repeat(2, max-content); gap: 6px 14px; }
.stat { display: inline-flex; align-items: center; gap: 3px; font: 0.78rem var(--font-mono); }
.stat i { font-style: normal; color: var(--muted); margin-right: 2px; }
.stat b { min-width: 2ch; text-align: center; }
.mini { width: 22px; height: 22px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 0; line-height: 1; }
.sim-table td { text-align: right; white-space: normal; }
.sim-table th { white-space: nowrap; color: var(--muted); font-weight: 500; }
.ghost { justify-self: start; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .result { transition: none; } }
/* ---- 2D views ---- */
.head-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.toggle { padding: 4px 9px; font-size: 0.78rem; }
.view { display: block; width: 100%; height: auto; border-radius: 8px; background: var(--floor); user-select: none; -webkit-user-select: none; }
.netview { max-height: 300px; }
.view text { font-family: var(--font-mono); }
.side-label { font-size: 13px; fill: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.floor { stroke: var(--muted); stroke-width: 2; opacity: 0.5; }
.net-mesh { opacity: 0.85; }
.mesh-line { stroke: var(--ink); stroke-width: 1; opacity: 0.35; fill: none; }
.net-tape { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
.post { stroke: var(--muted); stroke-width: 6; }
.antenna { stroke: var(--accent); stroke-width: 5; stroke-dasharray: 10 6; }
.blk .b-body, .blk .b-head { fill: var(--net); }
.blk .b-arm { stroke: var(--net); stroke-width: 9; stroke-linecap: round; fill: none; }
.blk-late .b-body, .blk-late .b-head { fill: var(--late); } .blk-late .b-arm { stroke: var(--late); }
.blk-missing { opacity: 0.45; } .blk-home { opacity: 0.3; } .blk-ready { opacity: 0.85; }
.fog rect { fill: var(--muted); opacity: 0.95; } .fog text { fill: var(--surface); font-size: 22px; text-anchor: middle; font-weight: 600; }
.set-trail { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 4 7; opacity: 0.55; }
.set-arc { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 6 6; }
.set-target { fill: none; stroke: var(--accent); stroke-width: 3; }
.ball { fill: #f5d33b; stroke: var(--ink); stroke-width: 2; }
.tok circle { fill: var(--ink); } .tok-label { fill: var(--surface); font-size: 13px; font-weight: 600; text-anchor: middle; }
.tok-sub { fill: var(--ink); font-size: 12px; text-anchor: middle; }
.tok-setter circle { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; } .tok-setter .tok-label { fill: var(--ink); }
.tok-hitter circle { fill: var(--accent); }
.tok-decoy { opacity: 0.45; }

.hit-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 640px) { .hit-grid { grid-template-columns: minmax(0, 1fr); } }
.hit-grid.reveal { animation: reveal 0.35s ease both; animation-delay: calc(var(--slowmo) * 0.9); }
@keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.court-wrap { display: grid; gap: 10px; }
.court-wrap .swing { justify-self: stretch; justify-content: center; font-size: 1.05rem; padding: 12px 16px; }
.courtview { max-width: 460px; justify-self: center; cursor: crosshair; }
.court { fill: var(--court); stroke: var(--surface); stroke-width: 3; }
.court-line { stroke: var(--surface); stroke-width: 2; }
.court-net { stroke: var(--ink); stroke-width: 5; }
.shadow { fill: var(--net); } .shadow-formed { opacity: 0.3; } .shadow-late { opacity: 0.12; }
.hands { fill: var(--net); } .hands-late { fill: var(--late); } .hands-home { opacity: 0.35; }
.reach { fill: var(--muted); fill-opacity: 0.08; stroke: var(--muted); stroke-opacity: 0.35; stroke-width: 1.5; stroke-dasharray: 4 5; }
.defender { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.ghost-def { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0.45; }
.ghost-line { stroke: var(--ink); stroke-width: 1.5; opacity: 0.35; stroke-dasharray: 3 3; }
.keyed { color: var(--accent); font-weight: 600; }
.mark { cursor: pointer; }
.mark circle { fill: var(--rc); stroke: var(--surface); stroke-width: 3; }
.mark text { fill: var(--ink); font-size: 12px; text-anchor: middle; font-weight: 600; paint-order: stroke; stroke: var(--court); stroke-width: 4px; }
.mark-on circle { stroke: var(--ink); stroke-width: 4; r: 16; }
.cone { fill: var(--rc); opacity: 0.28; stroke: var(--rc); stroke-width: 2; }
.cone-2 { opacity: 0.1; stroke: none; }
.aim-path { fill: none; stroke: var(--rc); stroke-width: 3; stroke-dasharray: 7 6; }
.r-plain { --rc: var(--accent); } .r-great { --rc: var(--great); } .r-good { --rc: var(--good); } .r-even { --rc: var(--even); } .r-risky { --rc: var(--risky); } .r-bad { --rc: var(--bad); }
.rate { font: 600 0.72rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 7px; border-radius: 99px; background: var(--rc); color: #fff; white-space: nowrap; }
.rate-guess { background: none; color: var(--muted); border: 1px dashed var(--muted); }
.call-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.dots { display: inline-flex; align-items: center; gap: 3px; font: 0.72rem var(--font-mono); color: var(--muted); }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--net); display: inline-block; }
.dots i.on { background: var(--net); }
.dots-fuzzy i { border-style: dashed; filter: blur(0.6px); }
.dots span { margin-left: 3px; }
.shot-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.shot-about { font-size: 0.84rem; color: var(--muted); }
.shot-on { border-color: var(--accent); border-width: 2px; padding: 9px 11px; background: var(--surface); }
.court-result { max-width: 360px; }
.burst circle { fill: var(--net); opacity: 0.3; } .burst path { stroke: var(--net); stroke-width: 4; }
.burst-err circle { fill: var(--error); opacity: 0.4; }
.res-label { font-size: 18px; font-weight: 600; text-anchor: middle; fill: var(--net); } .res-err { fill: var(--error); }
.ball-path { fill: none; stroke-width: 3; stroke-dasharray: 7 6; }
.land circle { stroke-width: 3; } .land path { stroke-width: 3; }
.land-kill { stroke: var(--kill); } .land-kill circle { fill: var(--kill); } .land-kill path { stroke: #fff; }
.land-dug { stroke: var(--dug); } .land-dug circle { fill: var(--dug); } .land-dug path { stroke: #fff; }
.land-err { stroke: var(--error); } .land-err circle { fill: var(--error); } .land-err path { stroke: #fff; }
.shake { animation: shake 0.42s ease; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }
@media (prefers-reduced-motion: reduce) { .hit-grid.reveal { animation: none; } }

</style>
