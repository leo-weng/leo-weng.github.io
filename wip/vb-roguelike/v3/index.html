<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Spike Zones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap">
<style>
/* One look on purpose: a gym at night. Court in hardwood orange, their players in red, you in blue. Everything fits one phone screen. */
:root {
  --bg: #13182b; --panel: #1d2440; --ink: #f4f1ff; --muted: #9aa3c7;
  --floor: #e59a4f; --floor-2: #d4863b; --line: #fff7ea;
  --them: #e2453c; --you: #3d8bff; --kill: #34d27b; --bad: #ff5a4e;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
.app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-block: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--panel); border-radius: 14px; padding: 10px 16px; }
.score .side { display: flex; flex-direction: column; gap: 2px; }
.score .side.them { text-align: right; }
.score .who { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.score .pts { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.score .you .pts { color: var(--you); } .score .them .pts { color: var(--them); }
.score .to { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.hint { text-align: center; font-weight: 700; color: var(--muted); min-height: 1.4em; margin: 0; }
.stage { position: relative; }
svg { display: block; width: 100%; height: auto; touch-action: manipulation; user-select: none; }
.zone { fill: transparent; cursor: pointer; }
.zone:focus { outline: none; }
.zone:hover, .zone:focus-visible { fill: rgba(255, 255, 255, .14); }
.locked .zone { cursor: default; pointer-events: none; }
.banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.banner span { font-family: var(--display); font-size: clamp(44px, 15vw, 72px); letter-spacing: .02em; text-transform: uppercase;
  text-shadow: 0 4px 0 rgba(0, 0, 0, .35); transform: scale(.6); opacity: 0; transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), opacity .12s; }
.banner.show span { transform: scale(1); opacity: 1; }
.banner .kill { color: var(--kill); } .banner .bad { color: var(--bad); } .banner .plain { color: var(--ink); }
.end[hidden] { display: none; }
.end { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; }
.end h2 { font-family: var(--display); font-size: 34px; margin: 0; text-transform: uppercase; }
button.go { font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .04em; color: var(--bg); background: var(--floor);
  border: 0; border-radius: 14px; padding: 14px 28px; cursor: pointer; }
button.go:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
.ball { transition: cx .45s cubic-bezier(.4, .1, .6, 1), cy .45s cubic-bezier(.4, .1, .6, 1); }
@media (prefers-reduced-motion: reduce) { .ball, .banner span { transition: none; } }
</style>

<div class="app">
  <div class="score" aria-live="polite">
    <div class="side you"><span class="who">You</span><span class="pts" id="us">0</span></div>
    <span class="to">First to 11</span>
    <div class="side them"><span class="who">Them</span><span class="pts" id="them">0</span></div>
  </div>
  <p class="hint" id="hint">Tap where to hit.</p>
  <div class="stage">
    <svg id="court" viewBox="-8 0 116 118" role="img" aria-label="Their court"></svg>
    <div class="banner" id="banner"><span></span></div>
  </div>
  <div class="end" id="end" hidden><h2 id="endTitle"></h2><button class="go" id="again">Play again</button></div>
</div>

<script>
// ---- Model (same as model.js) ----
const LANE_X = [1.5, 4.5, 7.5];
const TARGET_D = { short: 1.6, deep: 6.8 };
const R = { back: 1.9, off: 1.7 };
const TO_WIN = 11, THEY_SCORE = 0.5;
const rng = Math.random;
const rnd = (a, b) => a + rng() * (b - a);
function setup() {
  const h = Math.floor(rng() * 3);
  const lanes = [h];
  if (rng() < 0.6) lanes.push(h === 1 ? (rng() < 0.5 ? 0 : 2) : 1);
  const defs = [];
  for (let l = 0; l < 3; l++) if (!lanes.includes(l)) defs.push({ x: LANE_X[l] + rnd(-0.9, 0.9), d: rnd(2.2, 3.6), r: R.off });
  const up = rng() < 0.5;
  [1.3, 4.5, 7.7].forEach((bx, i) => {
    if (up && i === 1) defs.push({ x: LANE_X[lanes[0]] + rnd(-0.8, 0.8), d: rnd(2.6, 3.8), r: R.back });
    else defs.push({ x: Math.min(8.6, Math.max(0.4, bx + rnd(-1.3, 1.3))), d: rnd(6.0, 8.2), r: R.back });
  });
  return { h, block: lanes, defs };
}
const ZONES = [];
for (const depth of ["deep", "short"]) for (let l = 0; l < 3; l++) ZONES.push({ depth, lane: l, x: LANE_X[l], d: TARGET_D[depth] });
function verdict(s, z) {
  if (z.depth === "deep" && s.block.includes(z.lane)) return "blocked";
  for (const p of s.defs) if (Math.hypot(p.x - z.x, p.d - z.d) <= p.r) return "dug";
  return "kill";
}

// ---- Drawing: 10 units per meter, their end line at the top, the net at y=95 ----
const X = (x) => 5 + x * 10, Y = (d) => 95 - d * 10;
const svg = document.getElementById("court");
const NS = "http://www.w3.org/2000/svg";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function el(tag, attrs, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

const st = { us: 0, them: 0, s: null, busy: false };
function draw() {
  const s = st.s;
  svg.innerHTML = "";
  el("rect", { x: 5, y: 5, width: 90, height: 90, fill: css("--floor"), stroke: css("--line"), "stroke-width": 0.8 });
  el("rect", { x: 5, y: 65, width: 90, height: 30, fill: css("--floor-2") });
  el("line", { x1: 5, y1: 65, x2: 95, y2: 65, stroke: css("--line"), "stroke-width": 0.6 });
  for (const lx of [35, 65]) el("line", { x1: lx, y1: 5, x2: lx, y2: 95, stroke: css("--line"), "stroke-width": 0.3, "stroke-dasharray": "1.5 2", opacity: 0.6 });
  // The block's shadow: a hard swing deep in these lanes gets blocked.
  for (const l of s.block) el("rect", { x: X(l * 3), y: 5, width: 30, height: 60, fill: "#000", opacity: 0.22 });
  // Their diggers: anything inside a circle gets dug.
  for (const p of s.defs) {
    el("circle", { cx: X(p.x), cy: Y(p.d), r: p.r * 10, fill: css("--them"), "fill-opacity": 0.22, stroke: css("--them"), "stroke-width": 0.5 });
    el("circle", { cx: X(p.x), cy: Y(p.d), r: 2.6, fill: css("--them"), stroke: css("--line"), "stroke-width": 0.5 });
  }
  // Target dots and tap zones.
  ZONES.forEach((z, i) => {
    el("circle", { cx: X(z.x), cy: Y(z.d), r: 1.3, fill: css("--line"), opacity: 0.85 });
    const r = el("rect", { class: "zone", x: X(z.lane * 3), y: z.depth === "deep" ? 5 : 65, width: 30, height: z.depth === "deep" ? 60 : 30, tabindex: 0, role: "button",
      "aria-label": `${z.depth === "deep" ? "Deep" : "Short"} ${["left", "middle", "right"][z.lane]}` });
    r.addEventListener("click", () => swing(i));
    r.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); swing(i); } });
  });
  // Net, blockers, and your hitter.
  el("rect", { x: 3, y: 94, width: 94, height: 2.2, fill: css("--line") });
  for (const l of s.block) el("rect", { x: X(LANE_X[l]) - 8, y: 91.5, width: 16, height: 3.6, rx: 1.8, fill: css("--them"), stroke: css("--line"), "stroke-width": 0.4 });
  el("circle", { cx: X(LANE_X[s.h]), cy: 106, r: 4, fill: css("--you"), stroke: css("--line"), "stroke-width": 0.6 });
  st.ball = el("circle", { class: "ball", cx: X(LANE_X[s.h]), cy: 100, r: 2.2, fill: "#fff7c2", stroke: "#3a2a00", "stroke-width": 0.4 });
}
function banner(text, kind) {
  const b = document.getElementById("banner"), sp = b.querySelector("span");
  sp.textContent = text; sp.className = kind;
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function setScore() { document.getElementById("us").textContent = st.us; document.getElementById("them").textContent = st.them; }
async function swing(i) {
  if (st.busy) return;
  st.busy = true;
  svg.classList.add("locked");
  document.getElementById("hint").textContent = "";
  const z = ZONES[i], v = verdict(st.s, z);
  // The ball flies to the box (or into the block).
  const tx = X(z.x), ty = v === "blocked" ? 92 : Y(z.d);
  requestAnimationFrame(() => { st.ball.setAttribute("cx", tx); st.ball.setAttribute("cy", ty); });
  await wait(480);
  if (v === "kill") { st.us++; banner("Kill!", "kill"); }
  else if (v === "blocked") { st.them++; banner("Blocked", "bad"); }
  else {
    banner("Dug", "plain");
    await wait(900);
    // They swing back. Half the time it's their point, otherwise you dig it and swing again.
    if (rng() < THEY_SCORE) { st.them++; banner("They score", "bad"); }
    else { banner("You dig it", "plain"); }
  }
  setScore();
  await wait(1000);
  document.getElementById("banner").classList.remove("show");
  if (st.us >= TO_WIN || st.them >= TO_WIN) return finish();
  next();
}
function next() {
  st.s = setup();
  draw();
  svg.classList.remove("locked");
  document.getElementById("hint").textContent = "Tap where to hit.";
  st.busy = false;
}
function finish() {
  document.getElementById("endTitle").textContent = st.us > st.them ? `You win ${st.us}–${st.them}` : `They win ${st.them}–${st.us}`;
  document.getElementById("end").hidden = false;
  document.getElementById("hint").textContent = "";
}
document.getElementById("again").addEventListener("click", () => {
  st.us = 0; st.them = 0; setScore();
  document.getElementById("end").hidden = true;
  next();
});
next();
</script>
</body></html>
